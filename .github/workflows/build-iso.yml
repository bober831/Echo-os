name: Build EchoOS ISO
# Запуск: вкладка Actions -> Build EchoOS ISO -> Run workflow.
# Готовые ISO появятся в Releases. Исходники системы встроены ниже (base64).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
