          tar xzf src.tgz -C echoos
          ls -R echoos | head -40

      - name: Собрать ISO в контейнере Alpine
        run: |
          mkdir -p out
          docker run --rm --privileged -e ECHOOS_DEBUG=1 \
            -v "$PWD/echoos:/src:ro" -v "$PWD/out:/out" \
            alpine:latest sh /src/iso/build.sh
          sudo chown -R "$USER" out
          for f in out/*.iso; do mv "$f" "out/EchoOS-debug-${{ matrix.arch }}.iso"; done
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: EchoOS-debug-${{ matrix.arch }}
          path: out/*.iso
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: isos
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: echoos-debug-${{ github.run_number }}
          name: EchoOS DEBUG сборка ${{ github.run_number }}
          files: isos/*.iso
